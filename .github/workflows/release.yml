name: Poly Day release microservice gateway

on:
  push:
    branches: [ "release_**" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ${{vars.PROJECT_NAME}}
      MICROSERVICE_NAME: ${{vars.MICROSERVICE_NAME}}
      APP_NAME: ${{vars.PROJECT_NAME}}_${{vars.MICROSERVICE_NAME}}

    steps:
      - name: Preparing git branch
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Setup SSH
        uses: MrSquaare/ssh-setup-action@v1
        with:
          host: github.com
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Setup git
        run: make setup-git

      - name: Up test environment
        run: make up-test-environment

      - name: Unit test
        run: make test

      - name: Build binary
        run: make build

      - name: Login into docker
        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_ACCESS_TOKEN}}

      - name: Build docker image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/poly_day_microservice_gateway:${{github.ref_name}} .

      - name: Push docker tag
        run: docker push ${{secrets.DOCKER_USERNAME}}/poly_day_microservice_gateway:${{github.ref_name}}

      - name: Success result
        if: ${{ success() }}
        run: |
          curl \
            -X POST https://api.telegram.org/bot${{secrets.TELEGRAM_BOT_TOKEN}}/sendMessage?chat_id=${{secrets.TELEGRAM_CHAT_ID}} \
            --header "Content-Type:application/json" \
            --data '{"text":"Project: microservice-gateway\nVersion: ${{github.ref_name}}\nRelease: Success ✅\nTriggered by: ${{github.event.pusher.email}}"}'

      - name: Failure result
        if: ${{ failure() }}
        run: |
          curl \
            -X POST https://api.telegram.org/bot${{secrets.TELEGRAM_BOT_TOKEN}}/sendMessage?chat_id=${{secrets.TELEGRAM_CHAT_ID}} \
            --header "Content-Type:application/json" \
            --data '{"text":"Project: microservice-gateway\nVersion: ${{github.ref_name}}\nRelease: Failed ❌\nTriggered by: ${{github.event.pusher.email}}"}'